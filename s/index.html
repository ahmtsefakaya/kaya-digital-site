<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SMS</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f141b;color:#e6e9ee;padding:22px;text-align:center}
a{display:block;margin:18px auto;max-width:360px;padding:16px;border-radius:12px;background:#1f7a3d;color:#fff;font-weight:700;font-size:18px;text-decoration:none}
p{color:#9aa4b2;font-size:14px;text-align:left;max-width:360px;margin:12px auto;white-space:pre-wrap}</style></head><body>
<h3 id="ad">SMS</h3><a id="git" href="#">📱 Mesaj uygulamasında aç</a><p id="m"></p>
<script>
const q=new URLSearchParams(location.search), to=(q.get('to')||'').replace(/[^\d+]/g,''), body=q.get('b')||'';
const ios=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const u=`sms:${to.startsWith('+')?to:'+1'+to}${ios?'&':'?'}body=${encodeURIComponent(body)}`;
document.getElementById('ad').textContent=(q.get('n')||'SMS')+' · '+to;document.getElementById('git').href=u;document.getElementById('m').textContent=body;
setTimeout(()=>{location.href=u},300);
</script></body></html>
